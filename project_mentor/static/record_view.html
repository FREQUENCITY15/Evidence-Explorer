<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evidence Explorer — Record</title>
  <style>
    :root { color-scheme: dark; --page:#111827; --panel:#1f2937; --muted:#9ca3af; --line:#374151; --text:#f9fafb; --pass:#065f46; --fail:#991b1b; --warn:#92400e; --unknown:#374151; --link:#93c5fd; }
    * { box-sizing: border-box; }
    body { margin:0; color:var(--text); background:var(--page); font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { max-width:1180px; margin:0 auto; padding:28px 18px 48px; }
    h1 { margin:0 0 4px; font-size:1.7rem; } h2 { margin:0; font-size:1.1rem; } h3 { margin:0 0 8px; font-size:.95rem; color:#d1d5db; }
    p { margin:.4rem 0; } .muted { color:var(--muted); }
    .toolbar, .card, .notice { border:1px solid var(--line); border-radius:10px; background:var(--panel); }
    .toolbar { display:flex; gap:10px; align-items:end; flex-wrap:wrap; padding:14px; margin:20px 0; }
    label { display:grid; gap:5px; color:#d1d5db; font-size:.9rem; } select, input, button { min-height:38px; border-radius:7px; border:1px solid #4b5563; padding:7px 10px; font:inherit; } select, input { color:var(--text); background:#111827; } select { min-width:min(520px,75vw); } input[type="file"] { max-width:min(360px,75vw); } button { color:#111827; background:#bfdbfe; font-weight:650; cursor:pointer; } button:hover { background:#dbeafe; } button:disabled { cursor:not-allowed; opacity:.55; }
    .notice { padding:16px; } .notice.error { border-color:#dc2626; background:#3f1519; }
    .grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); margin:14px 0; }
    .card { padding:15px; } .value, pre { overflow-wrap:anywhere; white-space:pre-wrap; }
    .value { font-weight:600; } pre { margin:0; padding:12px; color:#e5e7eb; background:#111827; border:1px solid var(--line); border-radius:7px; font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; }
    .section { margin-top:18px; } .section > h2 { margin:0 0 9px; }
    .badges { display:grid; grid-template-columns:repeat(auto-fit,minmax(155px,1fr)); gap:9px; }
    .badge { padding:10px; border-radius:8px; border:1px solid transparent; } .badge strong { display:block; font-size:.8rem; text-transform:uppercase; letter-spacing:.035em; } .badge span { display:block; margin-top:2px; overflow-wrap:anywhere; }
    .pass { background:var(--pass); border-color:#059669; } .fail { background:var(--fail); border-color:#ef4444; } .warn { background:var(--warn); border-color:#f59e0b; } .unknown { background:var(--unknown); border-color:#6b7280; }
    .govern-banner { padding:15px; border:1px solid var(--line); border-radius:10px; } .govern-banner strong { display:block; font-size:1.05rem; text-transform:uppercase; letter-spacing:.04em; } .govern-green { background:var(--pass); border-color:#059669; } .govern-red { background:var(--fail); border-color:#ef4444; } .govern-amber, .govern-flagged { background:var(--warn); border-color:#f59e0b; } .govern-unscored { background:var(--unknown); border-color:#6b7280; }
    .finding { margin-top:10px; } .finding .severity { color:var(--muted); font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.035em; }
    .citation-links { display:grid; gap:4px; margin-top:8px; } .citation-links a { color:var(--link); font:12px/1.35 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; overflow-wrap:anywhere; }
    .raw-wrap { overflow:auto; max-height:620px; border:1px solid var(--line); border-radius:7px; background:#111827; }
    .raw-evidence { min-width:max-content; margin:0; padding:12px 12px 12px 58px; color:#e5e7eb; font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; }
    .raw-evidence li { min-height:1.5em; padding:0 8px; white-space:pre; scroll-margin:18px; } .raw-evidence li::marker { color:#6b7280; }
    .raw-evidence li.evidence-target { background:#1e3a5f; outline:1px solid var(--link); }
    .list { margin:0; padding-left:20px; } .list li { overflow-wrap:anywhere; } .footer { margin-top:22px; color:var(--muted); font-size:.9rem; }
    .hidden { display:none; }
    @media (max-width:560px) { main { padding:18px 12px 32px; } select { min-width:100%; } .toolbar label { width:100%; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Evidence Explorer</h1>
      <p class="muted">Read-only view of a canonical Agent-Tool-Evidence record.</p>
    </header>

    <div class="toolbar">
      <label for="record-select">Available record
        <select id="record-select" disabled><option>Loading records…</option></select>
      </label>
      <button id="load-button" type="button" disabled>Load record</button>
      <button id="export-json-button" type="button" disabled>Export audit JSON</button>
      <button id="export-markdown-button" type="button" disabled>Export audit Markdown</button>
      <label for="import-file">Import canonical JSON
        <input id="import-file" type="file" accept="application/json,.json">
      </label>
      <button id="import-button" type="button" disabled>Validate and import</button>
      <label for="raw-artifact-file">Raw artifact for checksum
        <input id="raw-artifact-file" type="file">
      </label>
      <button id="verify-checksum-button" type="button" disabled>Verify SHA-256</button>
    </div>

    <div id="status" class="notice">Loading record index…</div>
    <div id="checksum-status" class="notice hidden" aria-live="polite"></div>
    <article id="record" class="hidden" aria-live="polite"></article>
  </main>

  <script>
  (function () {
    "use strict";

    var select = document.getElementById("record-select");
    var loadButton = document.getElementById("load-button");
    var exportJsonButton = document.getElementById("export-json-button");
    var exportMarkdownButton = document.getElementById("export-markdown-button");
    var importFile = document.getElementById("import-file");
    var importButton = document.getElementById("import-button");
    var rawArtifactFile = document.getElementById("raw-artifact-file");
    var verifyChecksumButton = document.getElementById("verify-checksum-button");
    var status = document.getElementById("status");
    var checksumStatus = document.getElementById("checksum-status");
    var recordRoot = document.getElementById("record");
    var currentRecordId = null;
    var verdictNames = ["selection", "arguments", "protocol", "execution", "interpretation", "completion"];

    function element(tag, className, text) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined && text !== null) node.textContent = String(text);
      return node;
    }

    function valueAt(source, paths, fallback) {
      for (var i = 0; i < paths.length; i += 1) {
        var current = source;
        var parts = paths[i].split(".");
        for (var j = 0; j < parts.length && current != null; j += 1) current = current[parts[j]];
        if (current !== undefined && current !== "") return current;
      }
      return fallback === undefined ? null : fallback;
    }

    function display(value) {
      if (value === undefined || value === "") return "Not observed";
      if (value === null) return "null";
      if (typeof value === "string" || typeof value === "number" || typeof value === "boolean") return String(value);
      try { return JSON.stringify(value, null, 2); } catch (_) { return String(value); }
    }

    function jsonBlock(value) { return element("pre", "", display(value)); }
    function section(title) { var root = element("section", "section"); root.appendChild(element("h2", "", title)); return root; }
    function card(title, value) { var root = element("div", "card"); root.appendChild(element("h3", "", title)); root.appendChild(element("div", "value", display(value))); return root; }

    function setStatus(message, isError) {
      status.textContent = message;
      status.className = isError ? "notice error" : "notice";
      status.classList.remove("hidden");
    }

    function verdictText(verdict) {
      if (verdict === null || verdict === undefined) return "Not observed";
      if (typeof verdict !== "object") return String(verdict);
      return display(valueAt(verdict, ["status", "verdict", "outcome", "determination", "result"], verdict));
    }

    function verdictClass(text) {
      var normalized = String(text).trim().toLowerCase();
      var passVerdicts = ["pass", "valid", "success", "successful", "compliant", "accepted"];
      var failVerdicts = ["fail", "failed", "invalid", "invalid_test", "forbidden", "error", "reject", "rejected", "violation"];
      var warnVerdicts = ["flag", "flagged", "warn", "warning", "incomplete", "unknown", "missing", "not observed", "uncertain"];
      if (passVerdicts.indexOf(normalized) !== -1) return "pass";
      if (failVerdicts.indexOf(normalized) !== -1) return "fail";
      if (warnVerdicts.indexOf(normalized) !== -1) return "warn";
      return "unknown";
    }

    function appendList(parent, values) {
      var list = element("ul", "list");
      var items = Array.isArray(values) ? values : (values == null ? [] : [values]);
      if (!items.length) items = ["None observed"];
      items.forEach(function (item) { list.appendChild(element("li", "", display(item))); });
      parent.appendChild(list);
    }

    function pointerToken(value) {
      return String(value).replace(/~/g, "~0").replace(/\//g, "~1");
    }

    function pointerId(pointer) {
      return "evidence-pointer-" + encodeURIComponent(pointer);
    }

    function buildRawLines(value, pointer, indent, prefix, trailingComma, lines) {
      var padding = " ".repeat(indent);
      var suffix = trailingComma ? "," : "";
      if (Array.isArray(value)) {
        lines.push({ text: padding + prefix + "[", pointer: pointer });
        value.forEach(function (item, index) {
          buildRawLines(item, pointer + "/" + index, indent + 2, "", index < value.length - 1, lines);
        });
        lines.push({ text: padding + "]" + suffix, pointer: null });
        return;
      }
      if (value !== null && typeof value === "object") {
        var keys = Object.keys(value);
        lines.push({ text: padding + prefix + "{", pointer: pointer });
        keys.forEach(function (key, index) {
          buildRawLines(
            value[key],
            pointer + "/" + pointerToken(key),
            indent + 2,
            JSON.stringify(key) + ": ",
            index < keys.length - 1,
            lines
          );
        });
        lines.push({ text: padding + "}" + suffix, pointer: null });
        return;
      }
      lines.push({ text: padding + prefix + JSON.stringify(value) + suffix, pointer: pointer });
    }

    function rawEvidence(record) {
      var lines = [];
      buildRawLines(record, "#", 0, "", false, lines);
      var wrapper = element("div", "raw-wrap");
      var list = element("ol", "raw-evidence");
      lines.forEach(function (line) {
        var item = element("li", "", line.text);
        if (line.pointer) {
          item.id = pointerId(line.pointer);
          item.dataset.pointer = line.pointer;
          item.tabIndex = -1;
        }
        list.appendChild(item);
      });
      wrapper.appendChild(list);
      return wrapper;
    }

    function appendCitations(parent, references) {
      if (!Array.isArray(references) || !references.length) {
        parent.appendChild(element("span", "muted", "No evidence citations"));
        return;
      }
      var links = element("div", "citation-links");
      references.forEach(function (reference) {
        var link = element("a", "", reference);
        link.href = "#" + pointerId(reference);
        link.addEventListener("click", function (event) {
          event.preventDefault();
          var target = document.getElementById(pointerId(reference));
          if (!target) return;
          document.querySelectorAll(".evidence-target").forEach(function (node) { node.classList.remove("evidence-target"); });
          target.classList.add("evidence-target");
          target.scrollIntoView({ behavior: "smooth", block: "center" });
          target.focus({ preventScroll: true });
        });
        links.appendChild(link);
      });
      parent.appendChild(links);
    }

    function renderRecord(data, validation, filename) {
      var attemptId = valueAt(data, ["attemptId", "attempt.id", "metadata.id"], filename);
      var model = valueAt(data, ["modelInteraction.modelName", "model.name", "metadata.model", "modelName"], null);
      var host = valueAt(data, ["host.hostName", "host.name", "environment.host", "metadata.host"], null);
      var timestamp = valueAt(data, ["recordedAt", "timestamp", "metadata.timestamp", "createdAt"], null);
      var toolSurface = valueAt(data, ["toolSurface", "tool_surface"], {});
      var interaction = valueAt(data, ["modelInteraction", "model_interaction"], {});
      var execution = valueAt(data, ["execution"], {});
      var verdicts = valueAt(data, ["verdicts"], {});

      recordRoot.replaceChildren();
      var overview = section("Attempt");
      var overviewGrid = element("div", "grid");
      overviewGrid.append(card("Attempt ID", attemptId));
      overviewGrid.append(card("Model", model));
      overviewGrid.append(card("Host", host));
      overviewGrid.append(card("Timestamp", timestamp));
      overview.appendChild(overviewGrid);
      recordRoot.appendChild(overview);

      var tools = section("Tools");
      var toolsGrid = element("div", "grid");
      [
        ["Experimental", valueAt(toolSurface, ["effectiveExperimentalTools", "experimentalTools", "experimental"], [])],
        ["Host-internal", valueAt(toolSurface, ["hostInternalTools", "host_internal"], [])],
        ["Forbidden extra", valueAt(toolSurface, ["forbiddenExtraTools", "forbidden_extra"], [])]
      ].forEach(function (entry) { var toolCard = element("div", "card"); toolCard.appendChild(element("h3", "", entry[0])); appendList(toolCard, entry[1]); toolsGrid.appendChild(toolCard); });
      tools.appendChild(toolsGrid);
      recordRoot.appendChild(tools);

      var call = section("Call");
      var callGrid = element("div", "grid");
      callGrid.append(card("Selected tool", valueAt(interaction, ["parsedToolName", "selectedTool", "selectedToolName", "toolName", "firstToolCall.name"], valueAt(data, ["firstToolCall.name"], null))));
      callGrid.append(card("Arguments", valueAt(interaction, ["arguments", "rawArguments", "firstToolCall.rawArgs"], valueAt(data, ["firstToolCall.rawArgs"], null))));
      call.appendChild(callGrid);
      recordRoot.appendChild(call);

      var executionSection = section("Execution");
      var executionGrid = element("div", "grid");
      executionGrid.append(card("Protocol evidence", valueAt(data, ["protocolEvidence.details", "protocolEvidence.evidence", "protocolEvidence"], null)));
      executionGrid.append(card("Execution result", valueAt(execution, ["boundedToolResult", "result", "status", "details"], valueAt(data, ["firstToolCall.result"], null))));
      executionGrid.append(card("Execution successful", valueAt(execution, ["successful"], null)));
      executionSection.appendChild(executionGrid);
      recordRoot.appendChild(executionSection);

      var finalResponse = section("Final response");
      finalResponse.appendChild(jsonBlock(valueAt(data, ["finalAnswer", "final_answer", "modelInteraction.finalAnswer"], null)));
      recordRoot.appendChild(finalResponse);

      var governance = validation && validation.governance;
      var govern = section("Govern");
      if (governance) {
        var governStatus = element("div", "govern-banner govern-" + governance.status);
        governStatus.appendChild(element("strong", "", governance.status));
        governStatus.appendChild(element("span", "", governance.summary));
        governStatus.appendChild(element("span", "muted", governance.scoreable ? "Scored policy result" : "Not scoreable"));
        govern.appendChild(governStatus);
        (Array.isArray(governance.findings) ? governance.findings : []).forEach(function (finding) {
          var findingCard = element("div", "card finding");
          findingCard.appendChild(element("div", "severity", finding.severity));
          findingCard.appendChild(element("h3", "", finding.code));
          findingCard.appendChild(element("div", "", finding.message));
          appendCitations(findingCard, finding.evidenceRefs);
          govern.appendChild(findingCard);
        });
      } else {
        govern.appendChild(element("div", "notice", "Governance evaluation is unavailable."));
      }
      recordRoot.appendChild(govern);

      var quality = section("Evidence quality");
      var qualityGrid = element("div", "grid");
      qualityGrid.append(card("Canonical completeness", validation && validation.isComplete ? "Complete" : "Incomplete"));
      qualityGrid.append(card("Schema validation", validation ? "Passed" : "Not available"));
      quality.appendChild(qualityGrid);
      var gapsCard = element("div", "card");
      gapsCard.appendChild(element("h3", "", "Completeness gaps"));
      appendList(gapsCard, validation && validation.completenessGaps);
      quality.appendChild(gapsCard);
      var warningsCard = element("div", "card");
      warningsCard.appendChild(element("h3", "", "Warnings"));
      appendList(warningsCard, validation && validation.warnings);
      quality.appendChild(warningsCard);
      recordRoot.appendChild(quality);

      var verdictSection = section("Verdicts");
      var badges = element("div", "badges");
      verdictNames.forEach(function (name) {
        var verdict = verdicts && verdicts[name];
        var normalized = validation && validation.verdicts && validation.verdicts[name];
        var text = normalized ? normalized.determination : verdictText(verdict);
        var classification = normalized ? normalized.classification : verdictClass(text);
        var badge = element("div", "badge " + classification);
        badge.appendChild(element("strong", "", name));
        badge.appendChild(element("span", "", text));
        if (normalized && normalized.category) badge.appendChild(element("span", "muted", normalized.category));
        if (normalized && normalized.notes) badge.appendChild(element("span", "", normalized.notes));
        appendCitations(badge, normalized && normalized.evidenceRefs);
        badges.appendChild(badge);
      });
      verdictSection.appendChild(badges);
      recordRoot.appendChild(verdictSection);

      var source = section("Source");
      var sourceGrid = element("div", "grid");
      sourceGrid.append(card("Record", valueAt(data, ["_sourcePath", "source.path", "provenance.recordPath"], "evidence/sample/" + filename + ".json")));
      sourceGrid.append(card("Schema", valueAt(data, ["schemaVersion", "schema_version"], null)));
      sourceGrid.append(card("Record checksum", valueAt(data, ["checksums.main_jsonl", "checksums.record", "provenance.checksum"], null)));
      source.appendChild(sourceGrid);
      recordRoot.appendChild(source);

      var raw = section("Raw evidence");
      raw.appendChild(element("p", "muted", "Line-numbered canonical JSON. Verdict citations navigate to stable in-record pointers."));
      raw.appendChild(rawEvidence(data));
      recordRoot.appendChild(raw);

      recordRoot.appendChild(element("footer", "footer", "The source record is displayed read-only. Missing values are shown as “Not observed”."));
      recordRoot.classList.remove("hidden");
      status.classList.add("hidden");
    }

    function fetchJSON(url, options) {
      var request = options || {};
      request.headers = Object.assign({ "Accept": "application/json" }, request.headers || {});
      return fetch(url, request).then(function (response) {
        if (!response.ok) return response.json().catch(function () { return {}; }).then(function (body) { throw new Error(body.detail || ("Request failed (HTTP " + response.status + ")")); });
        return response.json();
      });
    }

    function filenameFromURL() {
      var match = window.location.pathname.match(/^\/evidence\/([^/]+)$/);
      try { return match ? decodeURIComponent(match[1]) : null; } catch (_) { return null; }
    }

    function loadRecord(filename, updateURL) {
      if (!filename) return;
      currentRecordId = null;
      rawArtifactFile.value = "";
      checksumStatus.classList.add("hidden");
      verifyChecksumButton.disabled = true;
      setStatus("Loading record…", false);
      recordRoot.classList.add("hidden");
      exportJsonButton.disabled = true;
      exportMarkdownButton.disabled = true;
      fetchJSON("/api/evidence/" + encodeURIComponent(filename) + "?include_validation=true").then(function (payload) {
        var data = payload && payload.record ? payload.record : payload;
        var validation = payload && payload.validation ? payload.validation : null;
        renderRecord(data, validation, filename);
        currentRecordId = filename;
        select.value = filename;
        exportJsonButton.disabled = false;
        exportMarkdownButton.disabled = false;
        if (updateURL) window.history.pushState({ filename: filename }, "", "/evidence/" + encodeURIComponent(filename));
      }).catch(function (error) { setStatus("Failed to load record: " + error.message, true); });
    }

    function downloadAudit(exportFormat) {
      var filename = select.value;
      if (!filename || (exportFormat !== "json" && exportFormat !== "markdown")) return;
      var extension = exportFormat === "json" ? "json" : "md";
      var link = element("a", "", "");
      link.href = "/api/evidence/" + encodeURIComponent(filename) + "/audit?export_format=" + exportFormat;
      link.download = filename + ".audit." + extension;
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    function loadIndex(preferredRecord) {
      fetchJSON("/api/evidence/index").then(function (data) {
        var records = Array.isArray(data.records) ? data.records : [];
        select.replaceChildren();
        if (!records.length) {
          var empty = element("option", "", "No records available"); empty.value = ""; select.appendChild(empty); setStatus("No evidence records are available.", true); return;
        }
        var prompt = element("option", "", "— select a record —"); prompt.value = ""; select.appendChild(prompt);
        records.forEach(function (filename) { var option = element("option", "", filename); option.value = filename; select.appendChild(option); });
        select.disabled = false; loadButton.disabled = false;
        var fromURL = preferredRecord || filenameFromURL();
        if (fromURL && records.indexOf(fromURL) !== -1) loadRecord(fromURL, Boolean(preferredRecord));
        else setStatus("Select a record to view its evidence.", false);
      }).catch(function (error) { setStatus("Failed to load record index: " + error.message, true); });
    }

    function importSelectedRecord() {
      var file = importFile.files && importFile.files[0];
      if (!file) return;
      importButton.disabled = true;
      setStatus("Validating and importing evidence…", false);
      file.text().then(function (raw) {
        var record;
        try { record = JSON.parse(raw); }
        catch (_) { throw new Error("Selected file does not contain valid JSON."); }
        if (!record || Array.isArray(record) || typeof record !== "object") throw new Error("Selected evidence must be a JSON object.");
        return fetchJSON("/api/evidence/import", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ record: record })
        });
      }).then(function (result) {
        importFile.value = "";
        loadIndex(result.recordId);
      }).catch(function (error) {
        setStatus("Import failed: " + error.message, true);
      }).finally(function () {
        importButton.disabled = !(importFile.files && importFile.files.length);
      });
    }

    function updateChecksumButton() {
      verifyChecksumButton.disabled = !(
        currentRecordId && rawArtifactFile.files && rawArtifactFile.files.length
      );
    }

    function verifySelectedArtifact() {
      var file = rawArtifactFile.files && rawArtifactFile.files[0];
      if (!currentRecordId || !file) return;
      verifyChecksumButton.disabled = true;
      checksumStatus.textContent = "Hashing the selected raw artifact locally…";
      checksumStatus.className = "notice";
      checksumStatus.classList.remove("hidden");
      fetchJSON("/api/evidence/" + encodeURIComponent(currentRecordId) + "/verify-checksum", {
        method: "POST",
        headers: { "Content-Type": "application/octet-stream" },
        body: file
      }).then(function (result) {
        if (result.verified) {
          checksumStatus.textContent = "Verified: supplied artifact matches the declared SHA-256 (" + result.byteCount + " bytes). The artifact was not retained.";
          checksumStatus.className = "notice pass";
        } else {
          checksumStatus.textContent = "Mismatch: supplied artifact does not match the declared SHA-256. The artifact was not retained.";
          checksumStatus.className = "notice error";
        }
      }).catch(function (error) {
        checksumStatus.textContent = "Checksum verification failed: " + error.message;
        checksumStatus.className = "notice error";
      }).finally(updateChecksumButton);
    }

    loadButton.addEventListener("click", function () { loadRecord(select.value, true); });
    exportJsonButton.addEventListener("click", function () { downloadAudit("json"); });
    exportMarkdownButton.addEventListener("click", function () { downloadAudit("markdown"); });
    importFile.addEventListener("change", function () { importButton.disabled = !(importFile.files && importFile.files.length); });
    importButton.addEventListener("click", importSelectedRecord);
    rawArtifactFile.addEventListener("change", updateChecksumButton);
    verifyChecksumButton.addEventListener("click", verifySelectedArtifact);
    select.addEventListener("change", function () { if (select.value) loadRecord(select.value, true); });
    window.addEventListener("popstate", function () { var filename = filenameFromURL(); if (filename) loadRecord(filename, false); });
    loadIndex();
  }());
  </script>
</body>
</html>
